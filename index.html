<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <svg class="mark" viewBox="0 0 200 200">
    <defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a63"/><stop offset=".55" stop-color="#e5202c"/><stop offset="1" stop-color="#8c0f18"/></linearGradient></defs>
    <circle cx="100" cy="100" r="98" fill="#111" stroke="#e5202c" stroke-width="3"/>
    <path d="M100 34 L112 92 L100 168 L88 92 Z" fill="url(#b)"/>
  </svg>
  <h1>مرحباً بك</h1>

  <div class="tabs">
    <button class="tab on" data-m="login">تسجيل الدخول</button>
    <button class="tab" data-m="register">حساب جديد</button>
  </div>

  <form id="f" autocomplete="off">
    <input id="u" placeholder="اسم المستخدم" required>
    <input id="p" type="password" placeholder="كلمة السر" required>
    <input id="role" type="hidden" value="user">
    <button class="btn" id="go">دخول</button>
  </form>

  <p id="msg"></p>
</main>
<script src="app.js"></script>
</body>
</html>
